name: Validate website

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PUBLIC_SITE_URL: https://globalbashtax.example
      PUBLIC_NOINDEX: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Astro files
        run: npm run check

      - name: Build website
        run: npm run build

      - name: Compile Cloudflare Functions
        run: npm run functions:check

      - name: Audit generated website
        run: node scripts/audit-build.mjs